# INI configuration; values are never executed as shell commands.
# Set up interactively with: sudo sentrylab configure
[general]
enabled = false
# Leave empty to use the hostname. Set a unique stable ID for each PVE node.
host_id =
# With the default 60-second timer, stale temperatures expire after 5 minutes.
expire_after = 300

[mqtt]
broker =
port = 1883
username =
password =
tls = false
# Optional private CA for TLS; empty uses the system trust store.
ca_file =
topic_prefix = sentrylab
discovery_prefix = homeassistant

[sensors]
cpu = true
disks = true
# Optional SATA/SAS/USB SMART temperature queries. Requires smartmontools.
# Uses smartctl -n standby,0; some USB bridges cannot report power state reliably.
smart = false
